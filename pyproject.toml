[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ved-sync"
version = "0.1.0"
description = "Sincronización conservadora entre múltiples repositorios"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ved-sync = "ved_sync.__main__:main"

[tool.setuptools.packages.find]
include = ["ved_sync*"]
